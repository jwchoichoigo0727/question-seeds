<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>질문탐구노트_질문씨앗팀🌱</title>
    <style>
        :root { --main-green: #2ecc71; --soft-bg: #f9fbf9; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--soft-bg); margin: 0; overflow-x: hidden; }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        
        button { background: var(--main-green); color: white; border: none; padding: 15px 30px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { transform: scale(1.05); background: #27ae60; }
        .secondary-btn { background: #34495e; font-size: 16px; padding: 10px 20px; }
        .secondary-btn:hover { background: #2c3e50; }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.8s ease forwards; }

        .input-group { display: flex; gap: 10px; justify-content: center; margin: 30px 0; }
        select { padding: 12px; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; flex: 1; max-width: 150px; }

        .form-box { background: white; padding: 30px; border-radius: 20px; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        input[type="text"], textarea { width: 100%; padding: 15px; margin: 10px 0 20px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 150px; }

        /* 게시판 상단 컨트롤 패널 */
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .board-header p { color: #7f8c8d; font-size: 14px; margin: 0; }

        /* 컨베이어 벨트 전체 껍데기 */
        .board { display: flex; gap: 20px; overflow: hidden; margin-top: 15px; position: relative; border-radius: 15px; background: rgba(255,255,255,0.5); padding: 10px; transition: height 0.3s; }
        
        .column { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        
        .card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e0f2f1; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.03); word-break: break-all; }
        .card:hover { border-color: var(--main-green); transform: translateY(-3px); }
        .card .title { font-weight: bold; color: #2c3e50; font-size: 16px; text-align: left; line-height: 1.4; }
        .card .info { font-size: 12px; color: #95a5a6; margin-top: 8px; text-align: left; }
        .empty-msg { width: 100%; padding: 50px; color: #7f8c8d; font-weight: bold; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; max-width: 500px; width: 90%; position: relative; text-align: left; }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; }

        @keyframes floatUpUniform { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        @keyframes floatDownUniform { 0% { transform: translateY(-50%); } 100% { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 스마트폰 모바일 반응형 (화면 폭 768px 이하) */
        @media (max-width: 768px) {
            .board { 
                flex-direction: column; /* 1열로 세로 배치 */
                height: auto !important; /* 높이 제한 해제 */
                overflow-y: visible; /* 잘림 방지 (자유롭게 스크롤) */
            }
            .column { 
                animation: none !important; /* 모바일에서는 애니메이션 강제 정지 */
                width: 100%; 
            }
            .input-group { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #2c3e50;">🌱 질문탐구노트_질문씨앗팀</h1>

    <div id="step1" class="step active">
        <h3>반갑습니다! 누구신가요?</h3>
        <div class="input-group">
            <select id="grade"><option value="">학년</option><script>for(let i=1;i<=3;i++) document.write(`<option value="${i}">${i}학년</option>`)</script></select>
            <select id="class"><option value="">반</option><script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">${i}반</option>`)</script></select>
            <select id="num"><option value="">번호</option><script>for(let i=1;i<=30;i++) document.write(`<option value="${i}">${i}번</option>`)</script></select>
        </div>
        <button onclick="nextStep(2)">질문 씨앗 심기</button>
    </div>

    <div id="step2" class="step">
        <div class="form-box">
            <label style="font-weight: bold; color: #2c3e50;">큰 주제 (질문 제목)</label>
            <input type="text" id="qTitle" placeholder="연구하고 싶은 핵심 질문을 적어주세요.">
            <label style="font-weight: bold; color: #2c3e50;">상세 내용</label>
            <textarea id="qContent" placeholder="질문에 대한 구체적인 배경이나 궁금한 점을 적어주세요."></textarea>
            <button onclick="submitQuestion()" style="width: 100%;">질문 제출하기</button>
        </div>
    </div>

    <div id="step3" class="step">
        <h3>우리 팀의 질문 정원</h3>
        <div class="board-header">
            <p id="countInfo"></p>
            <button id="toggleBtn" class="secondary-btn" onclick="toggleMyMode()">내 질문만 보기</button>
        </div>
        
        <div class="board" id="board">
            <div class="column" id="col1"></div>
            <div class="column" id="col2"></div>
            <div class="column" id="col3"></div>
        </div>
        <button onclick="nextStep(1)" style="margin-top: 30px; background: #95a5a6;">새 질문 작성하기</button>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="margin-top: 10px; color: #2c3e50;"></h2>
        <p id="modalInfo" style="color: #2ecc71; font-weight: bold; font-size: 14px;"></p>
        <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">
        <p id="modalBody" style="line-height: 1.6; color: #444; white-space: pre-wrap;"></p>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQX_nscs_kr07ft6RyzpvDjmFec_KS5taViUMYgweWfy6S_Q8r6Gk-jGrNmdzK9jc_eQ/exec"; // 시트 주소 입력
    let myInfo = {};
    let allQuestions = []; // 전체 질문 저장소
    let isMyMode = false; // '내 질문 모드' 상태 확인

    function nextStep(n) {
        if(n === 2) {
            myInfo = { grade: document.getElementById('grade').value, class: document.getElementById('class').value, num: document.getElementById('num').value };
            if(!myInfo.grade || !myInfo.class || !myInfo.num) return alert("정보를 모두 선택해주세요!");
        }
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        if(n === 3) fetchQuestions();
    }

    async function submitQuestion() {
        const title = document.getElementById('qTitle').value;
        const content = document.getElementById('qContent').value;
        if(!title || !content) return alert("내용을 입력해주세요!");

        const btn = document.querySelector('#step2 button');
        btn.innerText = "심는 중...";
        btn.disabled = true;

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ ...myInfo, title, content })
            });
            document.getElementById('qTitle').value = "";
            document.getElementById('qContent').value = "";
            isMyMode = false; // 제출 후에는 항상 '전체 보기' 모드로 초기화
            document.getElementById('toggleBtn').innerText = "내 질문만 보기";
            nextStep(3);
        } catch(e) {
            alert("저장에 실패했습니다. 다시 시도해주세요.");
        } finally {
            btn.innerText = "질문 제출하기";
            btn.disabled = false;
        }
    }

    function createCard(q) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="title">${q.title}</div><div class="info">${q.grade}학년 ${q.class}반 ${q.num}번</div>`;
        card.onclick = () => openModal(q);
        return card;
    }

    // 서버에서 데이터를 가져오는 함수
    async function fetchQuestions() {
        try {
            const res = await fetch(SCRIPT_URL);
            allQuestions = await res.json();
            renderBoard();
        } catch(e) {
            console.error("데이터 로딩 실패:", e);
        }
    }

    // '내 질문 보기' 버튼 클릭 시 작동
    function toggleMyMode() {
        isMyMode = !isMyMode;
        const btn = document.getElementById('toggleBtn');
        btn.innerText = isMyMode ? "전체 정원 보기" : "내 질문만 보기";
        renderBoard();
    }

    // 화면에 카드를 그리는 메인 함수 (방식 B 적용)
    function renderBoard() {
        const cols = [document.getElementById('col1'), document.getElementById('col2'), document.getElementById('col3')];
        const board = document.getElementById('board');
        
        // 화면 초기화
        cols.forEach(c => { c.innerHTML = ""; c.style.animation = ""; });
        board.style.height = 'auto';

        // 모드에 따라 데이터 필터링 (방식 B)
        let displayData = allQuestions;
        if (isMyMode) {
            displayData = allQuestions.filter(q => 
                q.grade == myInfo.grade && q.class == myInfo.class && q.num == myInfo.num
            );
        }

        document.getElementById('countInfo').innerText = isMyMode 
            ? `내가 심은 질문: ${displayData.length}개` 
            : `총 ${displayData.length}개의 질문이 심어졌습니다.`;

        if (displayData.length === 0) {
            cols[1].innerHTML = `<div class="empty-msg">아직 작성된 질문이 없습니다.</div>`;
            return;
        }

        // 3칸 분배
        const colData = [[], [], []];
        displayData.forEach((q, i) => colData[i % 3].push(q));

        // 내 질문 모드이거나, 전체 데이터가 9개 미만이면 정지 상태 (애니메이션 X)
        const isMoving = (!isMyMode && displayData.length >= 9);

        // 1세트 원본 배치
        cols.forEach((col, idx) => {
            colData[idx].forEach(q => col.appendChild(createCard(q)));
        });

        setTimeout(() => {
            // 움직여야 할 조건(전체 보기 + 9개 이상)일 때만 컨베이어 가동
            if (isMoving) {
                const minHeight = document.getElementById('col3').offsetHeight;
                board.style.height = minHeight + "px"; 

                cols.forEach((col, idx) => {
                    colData[idx].forEach(q => col.appendChild(createCard(q)));
                    const fullHeight = col.offsetHeight;
                    const duration = fullHeight / 40; 
                    
                    // 모바일(768px 이하)에서는 CSS의 !important 속성 때문에 이 애니메이션이 무시되어 자연스럽게 스크롤됩니다.
                    if (idx === 1) col.style.animation = `floatDownUniform ${duration}s linear infinite`;
                    else col.style.animation = `floatUpUniform ${duration}s linear infinite`;
                });
            } else {
                // 내 질문 모드(또는 데이터 부족)일 때는 스크롤이 안 되게 높이를 자동으로 놔둠
                board.style.height = 'auto'; 
            }
        }, 50);
    }

    function openModal(q) {
        document.getElementById('modalTitle').innerText = q.title;
        document.getElementById('modalInfo').innerText = `${q.grade}학년 ${q.class}반 ${q.num}번 학생의 질문`;
        document.getElementById('modalBody').innerText = q.content;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
</script>
</body>
</html>
